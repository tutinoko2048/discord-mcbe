on:
  workflow_dispatch:
    inputs:
      type:
        description: 'type of package'
        required: true
        default: 'app'
        type: choice
        options:
          - app
          - launcher

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from package.json
        id: version
        run: |
          if [ "${{ github.event.inputs.type }}" = "app" ]; then
            echo "VERSION=$(node -p \"require('../projects/server/package.json').version\")" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.type }}" = "launcher" ]; then
            echo "VERSION=$(node -p \"require('../projects/launcher/package.json').version\")" >> $GITHUB_ENV
          else
            echo "Invalid type: ${{ github.event.inputs.type }}"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Publish
        run: |
          if [[ ${{ env.VERSION }} =~ -([0-9A-Za-z]+)\. ]]; then
            pnpm publish --access public --no-git-checks --tag "${BASH_REMATCH[1]}" --dry-run
          else
            pnpm publish --access public --no-git-checks --dry-run
          fi
