name: Release App

on:
  workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from package.json
        run: |
          VERSION="$(node -p "require('./projects/server/package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Publish
        run: |
          if [[ "$VERSION" =~ -([0-9A-Za-z]+)\. ]]; then
            pnpm run publish app --access public --no-git-checks --tag "${BASH_REMATCH[1]}" --dry-run
          else
            pnpm run publish app --access public --no-git-checks --dry-run
          fi
