name: On Push
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Test launcher
        working-directory: ./projects/launcher
        run: pnpm run test
