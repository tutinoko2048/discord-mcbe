name: Release Launcher

on:
  push:
    tags:
      - 'launcher@v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check
        working-directory: ./projects/launcher
        run: pnpm run check

      - name: Test
        working-directory: ./projects/launcher
        run: pnpm run test

      - name: Read launcher version from package.json
        run: |
          VERSION="$(node -p "require('./projects/launcher/package.json').version")"
          echo "LAUNCHER_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify release tag
        run: |
          EXPECTED_TAG="launcher@v$LAUNCHER_VERSION"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match launcher version $LAUNCHER_VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "Release tag must be an annotated tag." >&2
            exit 1
          fi

      - name: Build launcher
        working-directory: ./projects/launcher
        run: pnpm run compile

      - name: Create launcher archives
        run: |
          ASSET_DIR="$RUNNER_TEMP/launcher-release-assets"
          mkdir -p "$ASSET_DIR"

          cd projects/launcher/build

          for platform in windows-x64 linux-x64 linux-arm64 linux-arm64-android darwin-x64 darwin-arm64; do
            (cd "$platform" && zip -r "$ASSET_DIR/discord-mcbe-$platform-v$LAUNCHER_VERSION.zip" .)
            extension=""
            [ "$platform" = "windows-x64" ] && extension=".exe"
            gzip -9 -c "$platform/updater$extension" > "$ASSET_DIR/discord-mcbe-updater-$platform-v$LAUNCHER_VERSION$extension.gz"
          done

          echo "LAUNCHER_ASSET_DIR=$ASSET_DIR" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "discord-mcbe launcher v$LAUNCHER_VERSION" \
            --draft \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-darwin-arm64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-darwin-x64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-linux-arm64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-linux-arm64-android-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-linux-x64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-windows-x64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR"/discord-mcbe-updater-*
