name: Release Launcher

on: workflow_dispatch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: ./projects/launcher
        run: pnpm run check

      - name: Read launcher version from package.json
        run: |
          VERSION="$(node -p "require('./projects/launcher/package.json').version")"
          echo "LAUNCHER_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build launcher
        working-directory: ./projects/launcher
        run: pnpm run compile

      - name: Create launcher archives
        run: |
          ASSET_DIR="$RUNNER_TEMP/launcher-release-assets"
          mkdir -p "$ASSET_DIR"

          cd projects/launcher/build

          for platform in windows-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            (cd "$platform" && zip -r "$ASSET_DIR/discord-mcbe-$platform-v$LAUNCHER_VERSION.zip" .)
          done

          echo "LAUNCHER_ASSET_DIR=$ASSET_DIR" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "launcher@v$LAUNCHER_VERSION" \
            --generate-notes \
            --target main \
            --title "launcher v$LAUNCHER_VERSION" \
            --draft \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-darwin-arm64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-darwin-x64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-linux-arm64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-linux-x64-v$LAUNCHER_VERSION.zip" \
            "$LAUNCHER_ASSET_DIR/discord-mcbe-windows-x64-v$LAUNCHER_VERSION.zip"
